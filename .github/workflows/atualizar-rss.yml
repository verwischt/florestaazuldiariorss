name: Atualizar RSS do Diário Oficial

on:
  schedule:
    # Segunda a Sexta, das 07h às 19h (horário de Brasília / UTC-3 -> 10h às 22h UTC).
    # Minutos 17 e 47 (a cada 30 min): evita filas de pico (:00 e :30) no GitHub Actions.
    - cron: '17,47 10-22 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'site/feed.xml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: diario-floresta-azul-pages
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testar gerador RSS
        run: npm test

      - name: Capturar JSON e atualizar feed
        id: update
        env:
          PORTAL_URL: https://diario.florestaazul.ba.gov.br/edicoes-anteriores
          EXPORT_BUTTON_TEXT: ${{ vars.EXPORT_BUTTON_TEXT }}
          EXPORT_BUTTON_SELECTOR: ${{ vars.EXPORT_BUTTON_SELECTOR }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_SUMMARIES_PER_RUN: ${{ vars.MAX_SUMMARIES_PER_RUN || '3' }}
        run: npm run update

      - name: Salvar estado no repositório
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json site/feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza estado do feed RSS"
            git push
          fi

      - name: Configurar GitHub Pages
        if: steps.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do RSS para publicação
        if: steps.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar no GitHub Pages
        if: steps.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4
